name: CI/CD Pipeline for Food Ordering App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t foodordering:latest .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Deploy to AKS
      run: |
        kubectl apply -f k8s/deployment.yml
        kubectl apply -f k8s/service.yml

    - name: Wait for deployment
      run: kubectl wait --for=condition=available --timeout=300s deployment/foodordering-deployment

    - name: Verify deployment
      run: |
        kubectl get pods
        kubectl get svc

    - name: Get external IP
      run: |
        echo "Waiting for LoadBalancer IP..."
        for i in {1..30}; do
          IP=$(kubectl get svc foodordering-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          if [ -n "$IP" ]; then
            echo "Application deployed successfully! Access at: http://$IP"
            break
          fi
          sleep 10
        done
